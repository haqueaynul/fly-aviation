<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlyEclipse Node.js Secure Sign In</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: rgba(15, 23, 42, 0.7); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .modal-box { background: #ffffff; width: 100%; max-width: 480px; border-radius: 28px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid #e2e8f0; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
    .input-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 14px; font-weight: 600; outline: none; }
    .btn-submit { width: 100%; padding: 14px; background: #6d3cc7; color: #ffffff; border: none; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="modal-box" id="loginModalTemplate">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 48px; height: 48px; background: #6d3cc7; color: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 12px auto;">✈</div>
      <h2 style="font-size: 22px; font-weight: 900; color: #0f172a;">FlyEclipse Authentication</h2>
      <p style="font-size: 12px; color: #64748b; margin-top: 4px;">Node.js Multi-Tenant Secure Portal (Channel Islands)</p>
    </div>

    <form onsubmit="return false;">
      <div class="input-group">
        <label>Workplace / Passenger Email</label>
        <input type="email" placeholder="e.g. captain@flyeclipse.com" id="loginEmail" />
      </div>

      <div class="input-group">
        <label>Security Password</label>
        <input type="password" placeholder="••••••••" id="loginPassword" />
      </div>

      <button type="submit" class="btn-submit" id="btnLoginSubmit">
        Authenticate & Verify MFA →
      </button>
    </form>
  </div>
</body>
</html>
